name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the tests that need macOS tools (Swift receipt helper, sips, plutil); they skip on Linux
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      # xmllint for the FinanzOnline XSD checks in tax-xml.test.ts (macOS has it); the XSDs are downloaded once
      - name: Install xmllint
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Cache FinanzOnline XSDs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nesev/finanzonline
          key: finanzonline-xsd-${{ hashFiles('src/server/services/tax-xml.test.ts') }}

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Demo seed
        run: NESEV_DATA_DIR="$RUNNER_TEMP/nesev-demo" NESEV_API_URL=http://127.0.0.1:9 bun scripts/demo-seed.ts > /dev/null
