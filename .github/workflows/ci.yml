name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the tests that need macOS tools (Swift receipt helper, sips, plutil); they skip on Linux
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Demo seed
        run: NESEV_DATA_DIR="$RUNNER_TEMP/nesev-demo" NESEV_API_URL=http://127.0.0.1:9 bun scripts/demo-seed.ts > /dev/null
